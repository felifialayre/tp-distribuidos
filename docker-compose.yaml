name: tp-distribuidos

services:
  rabbitmq:
    build: ./src/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  gateway_0:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_ID: gateway_0
      SERVER_PORT: "8080"
      OUTPUT_FILTER_EXCHANGE: records
      FILTER_PREFIX: filter
      FILTER_AMOUNT: "2"
      JOIN_AMOUNT: "2"
      INPUT_RESULTS_EXCHANGE: results
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway_1:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_ID: gateway_1
      SERVER_PORT: "8080"
      OUTPUT_FILTER_EXCHANGE: records
      FILTER_PREFIX: filter
      FILTER_AMOUNT: "2"
      JOIN_AMOUNT: "2"
      INPUT_RESULTS_EXCHANGE: results
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  filter_0:
    build:
      context: ./src
      dockerfile: filter/Dockerfile
    environment:
      INPUT_GATEWAY_EXCHANGE: records
      FILTER_PREFIX: filter
      FILTER_ID: "0"
      OUTPUT_STOPWORDS_EXCHANGE: stopwords
      STOPWORDS_PREFIX: stopwords
      STOPWORDS_AMOUNT: "2"
      OUTPUT_IDOWNLOADER_EXCHANGE: q2
      IDOWNLOADER_PREFIX: q2
      IDOWNLOADER_AMOUNT: "1"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
      OUTPUT_GATEWAY_EXCHANGE: results
    depends_on:
      rabbitmq:
        condition: service_healthy

  filter_1:
    build:
      context: ./src
      dockerfile: filter/Dockerfile
    environment:
      INPUT_GATEWAY_EXCHANGE: records
      FILTER_PREFIX: filter
      FILTER_ID: "1"
      OUTPUT_STOPWORDS_EXCHANGE: stopwords
      STOPWORDS_PREFIX: stopwords
      STOPWORDS_AMOUNT: "2"
      OUTPUT_IDOWNLOADER_EXCHANGE: q2
      IDOWNLOADER_PREFIX: q2
      IDOWNLOADER_AMOUNT: "1"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
      OUTPUT_GATEWAY_EXCHANGE: results
    depends_on:
      rabbitmq:
        condition: service_healthy

  stopwords_0:
    build:
      context: ./src
      dockerfile: stopwords/Dockerfile
    environment:
      INPUT_FILTER_EXCHANGE: stopwords
      STOPWORDS_PREFIX: stopwords
      STOPWORDS_ID: "0"
      FILTER_AMOUNT: "2"
      OUTPUT_JOIN_EXCHANGE: join
      JOIN_PREFIX: join
      JOIN_AMOUNT: "2"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  stopwords_1:
    build:
      context: ./src
      dockerfile: stopwords/Dockerfile
    environment:
      INPUT_FILTER_EXCHANGE: stopwords
      STOPWORDS_PREFIX: stopwords
      STOPWORDS_ID: "1"
      FILTER_AMOUNT: "2"
      OUTPUT_JOIN_EXCHANGE: join
      JOIN_PREFIX: join
      JOIN_AMOUNT: "2"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  join_0:
    build:
      context: ./src
      dockerfile: join/Dockerfile
    environment:
      INPUT_STOPWORDS_EXCHANGE: join
      JOIN_PREFIX: join
      JOIN_ID: "0"
      STOPWORDS_AMOUNT: "2"
      OUTPUT_GATEWAY_EXCHANGE: results
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  join_1:
    build:
      context: ./src
      dockerfile: join/Dockerfile
    environment:
      INPUT_STOPWORDS_EXCHANGE: join
      JOIN_PREFIX: join
      JOIN_ID: "1"
      STOPWORDS_AMOUNT: "2"
      OUTPUT_GATEWAY_EXCHANGE: results
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_0:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    environment:
      SERVER_HOST: gateway_0
      SERVER_PORT: "8080"
      INPUT_DIR: /input/client_0
      OUTPUT_DIR: /output/client_0
      BATCH_SIZE: "100"
    volumes:
      - ./input:/input:ro
      - ./output:/output
    depends_on:
      - gateway_0
    restart: "no"

  client_1:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    environment:
      SERVER_HOST: gateway_1
      SERVER_PORT: "8080"
      INPUT_DIR: /input/client_1
      OUTPUT_DIR: /output/client_1
      BATCH_SIZE: "100"
    volumes:
      - ./input:/input:ro
      - ./output:/output
    depends_on:
      - gateway_1
    restart: "no"
