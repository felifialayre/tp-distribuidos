  client_0:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    environment:
      SERVER_HOST: gateway_0
      SERVER_PORT: "8080"
      INPUT_DIR: /input/client_0
      OUTPUT_DIR: /output/client_0
      BATCH_SIZE: "100"
    volumes:
      - ./input:/input:ro
      - ./output:/output
    depends_on:
      - gateway_0
    restart: "no"

  client_1:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    environment:
      SERVER_HOST: gateway_1
      SERVER_PORT: "8080"
      INPUT_DIR: /input/client_1
