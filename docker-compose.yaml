name: tp-distribuidos

services:
  rabbitmq:
    build: ./src/rabbitmq
    ports:
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_ID: gateway-1
      SERVER_PORT: "8080"
      OUTPUT_QUEUE: input_queue
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

  filter:
    build:
      context: ./src
      dockerfile: filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy

  client:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    environment:
      SERVER_HOST: gateway
      SERVER_PORT: "8080"
      INPUT_FILE: /input/enwiki_namespace_0_00000.parquet
    volumes:
      - ./input:/input:ro
    depends_on:
      - gateway
    restart: "no"