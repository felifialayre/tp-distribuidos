services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - GATEWAY_ID=gateway_0
      - INPUT_QUEUE=results_queue
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - OUTPUT_QUEUE=input_queue
      - SERVER_HOST=gateway
      - SERVER_PORT=5678

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672

  filter:
    build:
      context: ./src/
      dockerfile: filter/Dockerfile
    container_name: filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - INPUT_QUEUE=results_queue
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
